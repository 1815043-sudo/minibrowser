<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromebook Mini Browser</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 15px; background: #f9f9f9; }
        .bar { display: flex; gap: 8px; margin-bottom: 12px; }
        input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px 18px; font-size: 16px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; }
        iframe { width: 100%; height: calc(100vh - 90px); border: 1px solid #ddd; border-radius: 6px; background: white; }
    </style>
</head>
<body>
    <div class="bar">
        <input type="text" id="urlInput" placeholder="https://example.com または URLを入力">
        <button onclick="openUrl()">開く</button>
    </div>
    <iframe id="browserFrame"></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sharedUrl = params.get('url');
        if (sharedUrl) {
            document.getElementById('urlInput').value = sharedUrl;
            document.getElementById('browserFrame').src = sharedUrl;
        }

        function openUrl() {
            let target = document.getElementById('urlInput').value.trim();
            if (!target) return;
            if (!target.startsWith('http://') && !target.startsWith('https://')) {
                target = 'https://' + target;
            }
            document.getElementById('browserFrame').src = target;
        }

        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') openUrl();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
